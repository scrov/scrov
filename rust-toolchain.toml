# webmcp-rs needs Rust 1.99 or newer. Pinned so CI, Cloudflare's builder and
# local machines compile with the same toolchain.
[toolchain]
channel = "1.100.0"
# No rust-docs or other extras: builders have little disk to spare.
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
