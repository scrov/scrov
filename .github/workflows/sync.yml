name: Sync Projects

on:
  schedule:
    - cron: "0 0 */14 * *"
  workflow_dispatch:
  push:
    paths:
      - src/data.yml
      - src/systems.yml
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    name: Sync GitHub Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run sync

      - name: Commit changes if updated
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update cached project metadata [skip ci]"
          file_pattern: "src/config.json .cache/sync.json"
