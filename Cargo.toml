[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/client",
    "crates/proxy",
    "crates/server",
    "crates/worker",
    "src-tauri",
]
default-members = ["crates/app", "crates/server"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
leptos = { version = "0.8.23", default-features = false }
shtml = { git = "https://github.com/swlkr/shtml", rev = "29e2e552b8965cda88c495e5a000efd7042f0d83" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = "debuginfo"
